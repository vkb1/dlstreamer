name: Validate Skills
on:
  pull_request:
    paths:
      - ".github/skills/**"

jobs:
  validate_and_scan_skills:
    name: Validate and Scan Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skill-validator and skillspector
        run: |
          # skill-validator is not published to PyPI; install from the
          # agent-ecosystem distribution channel when it becomes available.
          pip install skill-validator
          # skillspector v2.3.7 — pinned to latest release commit SHA.
          pip install "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@ab0431ff2a9e9d75ba866f986be17f8600cfd086"

      - name: Validate published skills (strict)
        run: |
          skill-validator check \
            --strict \
            --emit-annotations \
            --allow-dirs=evals,benchmark \
            .github/skills/
          skill-validator check \
            --strict \
            --allow-dirs=evals,benchmark \
            -o markdown \
            .github/skills/ >> "$GITHUB_STEP_SUMMARY"

      - name: Validate draft skills (non-blocking)
        continue-on-error: true
        run: |
          skill-validator check \
            --emit-annotations \
            --allow-dirs=evals,benchmark \
            .github/skills/drafts/

      - name: Security scan skills
        continue-on-error: true
        run: |
          skillspector scan \
            .github/skills/ \
            --no-llm \
            --format sarif \
            --output security-report.sarif

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-report.sarif
