name: Validate Skills
on:
  pull_request:
    paths:
      - ".github/skills/**"

jobs:
  validate_and_scan_skills:
    name: Validate and Scan Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install skill-validator
        # Recommended Ubuntu install: go install pinned to latest tag (v1.5.6).
        # Source: https://github.com/agent-ecosystem/skill-validator
        run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@v1.5.6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install skillspector
        # Recommended install: pip from source, pinned to v2.3.7 commit SHA (no git tags published).
        # Source: https://github.com/NVIDIA/SkillSpector
        run: pip install "skillspector @ git+https://github.com/NVIDIA/SkillSpector.git@ab0431ff2a9e9d75ba866f986be17f8600cfd086"

      - name: Validate published skills (strict)
        run: |
          skill-validator check \
            --strict \
            --emit-annotations \
            --allow-dirs=evals,benchmark \
            .github/skills/
          skill-validator check \
            --strict \
            --allow-dirs=evals,benchmark \
            -o markdown \
            .github/skills/ >> "$GITHUB_STEP_SUMMARY"

      - name: Validate draft skills (non-blocking)
        continue-on-error: true
        run: |
          skill-validator check \
            --emit-annotations \
            --allow-dirs=evals,benchmark \
            .github/skills/drafts/

      - name: Security scan skills
        continue-on-error: true
        run: |
          skillspector scan \
            .github/skills/ \
            --no-llm \
            --format sarif \
            --output security-report.sarif

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-report.sarif
